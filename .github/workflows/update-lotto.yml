name: Update Lotto Data

on:
  workflow_dispatch:
  schedule:
    # Sunday 00:30 KST = Saturday 15:30 UTC
    - cron: '30 15 * * 6'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest lotto data
        run: |
          mkdir -p data
          curl --fail --retry 3 --silent --show-error \
            https://smok95.github.io/lotto/results/all.json \
            -o data/all.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/all.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update lotto results"
            git push
          fi
